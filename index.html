<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>服饰创意报告库 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#1a1a1a;min-height:100vh;}

/* ===== 顶部导航 ===== */
.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:#dc2626;color:#fff;display:flex;align-items:center;padding:0 20px;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.25);gap:12px;}
.topbar-logo{font-size:18px;font-weight:800;letter-spacing:.5px;}
.topbar-sub{font-size:12px;opacity:.75;margin-left:2px;}

/* ===== 一级导航按钮栏 ===== */
.section-nav{position:fixed;top:52px;left:0;right:0;background:#1a1a1a;padding:10px 20px;display:flex;gap:10px;z-index:999;box-shadow:0 2px 8px rgba(0,0,0,.3);}

.nav-btn{
  display:flex;align-items:center;gap:8px;
  padding:8px 18px;border-radius:20px;
  font-size:13px;font-weight:600;cursor:pointer;
  border:none;transition:all .25s;white-space:nowrap;
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);
}
.nav-btn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.85);}
.nav-btn.active{background:#dc2626;color:#fff;box-shadow:0 2px 10px rgba(220,38,38,.5);}

.nav-btn .btn-icon{
  width:22px;height:22px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0;
  background:rgba(255,255,255,.15);
}
.nav-btn.active .btn-icon{background:rgba(255,255,255,.25);}

/* ===== 主内容区 ===== */
.section-pane{display:none;padding:20px;}
.section-pane.active{display:block;}

/* ===== 区块标题 ===== */
.section-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px;}
.section-title{font-size:20px;font-weight:800;color:#1a1a1a;}
.section-badge{background:#fee2e2;color:#dc2626;font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;flex-shrink:0;margin-top:4px;}
.section-desc{font-size:13px;color:#888;margin-top:4px;}

/* ===== 报告卡片网格 ===== */
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}

/* ===== 报告卡片 ===== */
.report-card{
  background:#fff;border-radius:12px;
  box-shadow:0 1px 6px rgba(0,0,0,.08);
  border:1px solid #f0f0f0;
  overflow:hidden;
  transition:box-shadow .2s,transform .2s;
  text-decoration:none;display:block;color:inherit;
}
.report-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.12);transform:translateY(-2px);}
.report-card.latest{border:2px solid #dc2626;}

.card-top{
  background:linear-gradient(135deg,#dc2626,#991b1b);
  color:#fff;padding:14px 16px;position:relative;
}
.card-top.frames-bg{background:linear-gradient(135deg,#3b82f6,#1d4ed8);}
.card-top.brand-bg{background:linear-gradient(135deg,#7c3aed,#5b21b6);}

.card-label{font-size:10px;opacity:.8;margin-bottom:4px;font-weight:500;}
.card-date{font-size:18px;font-weight:800;letter-spacing:.5px;}
.card-period{font-size:11px;opacity:.85;margin-top:2px;}
.latest-badge{
  position:absolute;top:10px;right:12px;
  background:rgba(255,255,255,.25);color:#fff;
  font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;
}

.card-body{padding:14px 16px;}
.card-type{font-size:11px;color:#888;margin-bottom:6px;}
.card-stats{display:flex;gap:10px;flex-wrap:wrap;}
.card-stat{font-size:11px;color:#555;display:flex;align-items:center;gap:3px;}
.card-stat-dot{width:6px;height:6px;border-radius:50%;background:#dc2626;flex-shrink:0;}
.card-stat-dot.blue{background:#3b82f6;}
.card-stat-dot.purple{background:#7c3aed;}

.card-footer{padding:0 16px 14px;display:flex;align-items:center;justify-content:space-between;}
.card-link-btn{
  background:#fee2e2;color:#dc2626;
  font-size:12px;font-weight:600;padding:5px 14px;border-radius:8px;
  transition:all .2s;
}
.card-link-btn.blue{background:#dbeafe;color:#2563eb;}
.card-link-btn.purple{background:#ede9fe;color:#7c3aed;}
.report-card:hover .card-link-btn{background:#dc2626;color:#fff;}
.report-card:hover .card-link-btn.blue{background:#2563eb;color:#fff;}
.report-card:hover .card-link-btn.purple{background:#7c3aed;color:#fff;}

/* ===== 空占位 ===== */
.empty-state{text-align:center;padding:60px 20px;color:#aaa;}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-text{font-size:14px;}

/* ===== loading ===== */
.loading{text-align:center;padding:40px;color:#aaa;font-size:14px;}

/* ===== 响应式 ===== */
@media(max-width:600px){
  .section-nav{padding:8px 12px;gap:6px;}
  .nav-btn{padding:6px 12px;font-size:12px;}
  .nav-btn .btn-icon{width:18px;height:18px;font-size:10px;}
  .section-pane{padding:12px;}
  .report-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- 顶部 Red 导航 -->
<div class="topbar">
  <span class="topbar-logo">服饰创意报告库</span>
  <span class="topbar-sub">2026</span>
</div>

<!-- 三个一级导航按钮 -->
<div class="section-nav">
  <button class="nav-btn active" onclick="switchSection('chanye',this)">
    <span class="btn-icon">📊</span>
    服饰产业带
  </button>
  <button class="nav-btn" onclick="switchSection('frames',this)">
    <span class="btn-icon">🔬</span>
    男装逐帧剖析
  </button>
  <button class="nav-btn" onclick="switchSection('brand',this)">
    <span class="btn-icon">🏷️</span>
    服饰品牌组
  </button>
</div>

<!-- 主内容区 -->
<div style="margin-top:104px;">

  <!-- 服饰产业带 -->
  <div class="section-pane active" id="pane-chanye">
    <div class="section-header">
      <div style="flex:1">
        <div class="section-title">📊 服饰产业带 &middot; 跑量素材日报</div>
        <div class="section-desc">服饰8大类目每日Top12跑量素材，含消耗&middot;GMV&middot;ROI&middot;NEW角标</div>
      </div>
      <span class="section-badge" id="chanye-count">…</span>
    </div>
    <div class="report-grid" id="chanye-grid">
      <div class="loading">正在加载报告列表…</div>
    </div>
  </div>

  <!-- 男装逐帧剖析 -->
  <div class="section-pane" id="pane-frames">
    <div class="section-header">
      <div style="flex:1">
        <div class="section-title">🔬 男装逐帧剖析 &middot; 素材解读</div>
        <div class="section-desc">男装秋上新跑量素材逐帧拆解，创意亮点&middot;内容节奏&middot;学习建议</div>
      </div>
      <span class="section-badge" style="background:#dbeafe;color:#2563eb;" id="frames-count">…</span>
    </div>
    <div class="report-grid" id="frames-grid">
      <div class="loading">正在加载报告列表…</div>
    </div>
  </div>

  <!-- 服饰品牌组 -->
  <div class="section-pane" id="pane-brand">
    <div class="section-header">
      <div style="flex:1">
        <div class="section-title">🏷️ 服饰品牌组 &middot; 品牌专项报告</div>
        <div class="section-desc">品牌专项分析报告，敬请期待</div>
      </div>
      <span class="section-badge" style="background:#ede9fe;color:#7c3aed;" id="brand-count">…</span>
    </div>
    <div class="report-grid" id="brand-grid">
      <div class="loading">正在加载报告列表…</div>
    </div>
  </div>

</div>

<script>
// ===== 一级 Tab 切换 =====
function switchSection(key, el) {
  document.querySelectorAll('.section-pane').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('pane-' + key).classList.add('active');
  el.classList.add('active');
}

// ===== 构建服饰产业带卡片 =====
function buildChanyeCard(item, isLatest) {
  var latestMark = isLatest ? '<span class="latest-badge">最新</span>' : '';
  return '<a class="report-card' + (isLatest?' latest':'') + '" href="' + item.file + '" target="_blank">' +
    '<div class="card-top">' +
      '<div class="card-label">生成日期</div>' +
      '<div class="card-date">' + item.gen_date + '</div>' +
      '<div class="card-period">数据周期 ' + item.period + '</div>' +
      latestMark +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-type">服饰8大类目 · 跑量素材Top12</div>' +
      '<div class="card-stats">' +
        '<span class="card-stat"><span class="card-stat-dot"></span>男装·女装·男鞋·女鞋</span>' +
        '<span class="card-stat"><span class="card-stat-dot"></span>童装·运动·内衣·配饰</span>' +
      '</div>' +
    '</div>' +
    '<div class="card-footer"><span class="card-link-btn">查看报告 →</span></div>' +
  '</a>';
}

// ===== 构建逐帧剖析卡片 =====
function buildFramesCard(item, isLatest) {
  var latestMark = isLatest ? '<span class="latest-badge">最新</span>' : '';
  var title = item.date || item.title || '男装逐帧剖析';
  return '<a class="report-card' + (isLatest?' latest':'') + '" href="' + item.file + '" target="_blank">' +
    '<div class="card-top frames-bg">' +
      '<div class="card-label">生成日期</div>' +
      '<div class="card-date">' + item.gen_date + '</div>' +
      '<div class="card-period">' + title + '</div>' +
      latestMark +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-type">男装素材逐帧拆解 · 创意分析</div>' +
      '<div class="card-stats">' +
        '<span class="card-stat"><span class="card-stat-dot blue"></span>帧级创意标签</span>' +
        '<span class="card-stat"><span class="card-stat-dot blue"></span>学习建议</span>' +
      '</div>' +
    '</div>' +
    '<div class="card-footer"><span class="card-link-btn blue">查看报告 →</span></div>' +
  '</a>';
}

// ===== 构建品牌组卡片 =====
function buildBrandCard(item, isLatest) {
  var latestMark = isLatest ? '<span class="latest-badge">最新</span>' : '';
  var title = item.title || '品牌专项报告';
  return '<a class="report-card' + (isLatest?' latest':'') + '" href="' + item.file + '" target="_blank">' +
    '<div class="card-top brand-bg">' +
      '<div class="card-label">生成日期</div>' +
      '<div class="card-date">' + item.gen_date + '</div>' +
      '<div class="card-period">' + title + '</div>' +
      latestMark +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-type">服饰品牌组 · 专项分析</div>' +
      '<div class="card-stats">' +
        '<span class="card-stat"><span class="card-stat-dot purple"></span>' + (item.desc||'品牌数据分析') + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="card-footer"><span class="card-link-btn purple">查看报告 →</span></div>' +
  '</a>';
}

// ===== 加载报告列表 =====
function loadReports(jsonUrl, gridId, countId, buildCardFn) {
  var grid = document.getElementById(gridId);
  var countEl = document.getElementById(countId);
  fetch(jsonUrl + '?t=' + Date.now())
    .then(function(res){ if(!res.ok) throw new Error('not found'); return res.json(); })
    .then(function(list){
      if(!list || list.length === 0){
        grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无报告，敬请期待</div></div>';
        countEl.textContent = '0 份';
        return;
      }
      var sorted = list.slice().sort(function(a,b){ return b.gen_date.localeCompare(a.gen_date); });
      grid.innerHTML = sorted.map(function(item,i){ return buildCardFn(item, i===0); }).join('');
      countEl.textContent = sorted.length + ' 份';
    })
    .catch(function(){
      if(jsonUrl.indexOf('brand') >= 0){
        grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🚧</div><div class="empty-text">品牌组报告建设中，敬请期待</div></div>';
        countEl.textContent = '0 份';
      } else {
        grid.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">加载失败，请刷新重试</div></div>';
        countEl.textContent = '-';
      }
    });
}

// ===== 初始化 =====
loadReports('reports.json',          'chanye-grid', 'chanye-count', buildChanyeCard);
loadReports('analysis_reports.json', 'frames-grid', 'frames-count', buildFramesCard);
loadReports('brand_reports.json',    'brand-grid',  'brand-count',  buildBrandCard);
</script>
</body>
</html>
