<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快手服饰产业带秋上新素材日报</title>
<style>

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:#f5f5f5; }
a { text-decoration:none; color:inherit; }
.nav { position:fixed; top:0; left:0; right:0; height:56px; background:#dc2626; color:#fff;
       display:flex; align-items:center; padding:0 16px; z-index:200;
       box-shadow:0 2px 8px rgba(0,0,0,.15); gap:12px; }
.nav .logo { font-size:17px; font-weight:700; white-space:nowrap; }
.nav .date  { font-size:12px; opacity:.9; white-space:nowrap; margin-right:auto; }
.history-wrap { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.history-label { font-size:12px; opacity:.9; white-space:nowrap; }
#history-select { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.4);
  color:#fff; padding:4px 10px; border-radius:6px; font-size:13px; cursor:pointer;
  outline:none; max-width:200px; }
#history-select option { background:#dc2626; color:#fff; }
.tabs { position:fixed; top:56px; left:0; right:0; height:46px; background:#fff;
        display:flex; overflow-x:auto; border-bottom:2px solid #f0f0f0; z-index:100;
        scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { flex:1; min-width:88px; text-align:center; line-height:46px; font-size:13px;
       color:#888; cursor:pointer; border-bottom:3px solid transparent;
       white-space:nowrap; padding:0 8px; transition:color .2s; }
.tab.active { color:#dc2626; font-weight:700; border-bottom-color:#dc2626; }
.content { position:fixed; top:102px; bottom:0; left:0; right:0; overflow-y:auto; }
.panel { display:none; padding:14px; }
.panel.active { display:block; }
.cat-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
@media(max-width:700px){ .cat-stats { grid-template-columns:repeat(2,1fr); } }
.stat { background:#fff; border-radius:10px; padding:14px 16px; box-shadow:0 1px 6px rgba(0,0,0,.06); }
.stat-label { font-size:11px; color:#aaa; margin-bottom:4px; }
.stat-val { font-size:22px; font-weight:700; color:#dc2626; }
.stat-val.gmv { color:#059669; }
.stat-val.roi { color:#d97706; }
.stat-note { font-size:10px; color:#ccc; margin-top:3px; }
.cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
.card { background:#fff; border-radius:10px; overflow:hidden;
        box-shadow:0 2px 8px rgba(0,0,0,.07); transition:transform .15s,box-shadow .15s; }
.card:hover { transform:translateY(-3px); box-shadow:0 6px 18px rgba(0,0,0,.12); }
.card-new { border:2px solid #f59e0b; }
.card-rising { border:2px solid #dc2626; }
.badge-new { position:absolute; top:8px; left:8px; background:#f59e0b; color:#fff;
             font-size:11px; font-weight:700; padding:3px 8px; border-radius:4px;
             letter-spacing:1px; z-index:10; }
.badge-rising { position:absolute; top:8px; right:8px; background:#dc2626; color:#fff;
                font-size:11px; font-weight:700; padding:3px 8px; border-radius:4px;
                z-index:10; }
.cover { display:block; width:100%; height:196px; background-size:cover;
         background-position:center; position:relative; cursor:pointer; background-color:#f0f0f0; }
.play-btn { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            width:50px; height:50px; border-radius:50%; background:rgba(0,0,0,.52);
            color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center; }
.card-body { padding:11px; }
.vid-row { font-size:11px; color:#bbb; cursor:pointer; margin-bottom:5px;
           display:flex; align-items:center; gap:5px; }
.vid-label { background:#f3f4f6; padding:1px 5px; border-radius:3px; color:#999; font-size:10px; }
.vid-val { font-family:monospace; }
.prod-name { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
             overflow:hidden; font-size:13px; font-weight:600; color:#222;
             margin-bottom:8px; line-height:1.45; height:38px; }
.prod-name:hover { color:#dc2626; }
.tag-row { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:9px; }
.tag { font-size:11px; padding:2px 7px; border-radius:4px; font-weight:600; cursor:pointer; }
.tag-red    { background:#fee2e2; color:#dc2626; }
.tag-yellow { background:#fef3c7; color:#b45309; }
.tag-purple { background:#ede9fe; color:#7c3aed; }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; }
.metric { background:#f9fafb; border-radius:6px; padding:6px; text-align:center; }
.m-label { font-size:10px; color:#aaa; margin-bottom:2px; }
.m-val { font-size:12px; font-weight:700; color:#333; }
.m-val.green  { color:#16a34a; }
.m-val.orange { color:#ea580c; }
.m-val.red    { color:#dc2626; }
.empty { text-align:center; padding:60px 0; color:#bbb; font-size:14px;
         background:#fff; border-radius:10px; margin-top:8px; }

</style>
<style>body{padding-top:40px !important;}</style></head>
<body><div id="sw-nav" style="position:fixed;top:0;left:0;right:0;height:40px;background:#1e1e2e;color:#fff;display:flex;align-items:center;padding:0 16px;z-index:9999;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,.35);font-family:-apple-system,'PingFang SC',sans-serif;font-size:13px;"><a class="sw-btn active" href="https://dora-ye666.github.io/clothes-creative-report-2026-by-dora-ye/">📊 服饰产业带</a><a class="sw-btn" href="https://dora-ye666.github.io/clothes-creative-report-2026-by-dora-ye/analysis.html">🔬 男装逐帧剖析</a><a class="sw-btn" href="https://dora-ye666.github.io/brand-clothes-video-material-analysis-by-dora-ye/">🏷️ 服饰品牌组</a></div><style>
#sw-nav .sw-btn{display:inline-flex;align-items:center;padding:4px 12px;border-radius:6px;
  color:rgba(255,255,255,.7);text-decoration:none;transition:all .15s;}
#sw-nav .sw-btn:hover{color:#fff;background:rgba(255,255,255,.1);}
#sw-nav .sw-btn.active{color:#fff;background:#dc2626;font-weight:600;}
#sw-nav .sw-sep{width:1px;height:22px;background:rgba(255,255,255,.2);margin:0 4px;}
#sw-nav .sw-hist-wrap{display:flex;align-items:center;gap:6px;}
#sw-nav .sw-hist-label{font-size:12px;opacity:.8;white-space:nowrap;}
#sw-nav select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);
  color:#fff;padding:3px 8px;border-radius:5px;font-size:12px;cursor:pointer;outline:none;}
#sw-nav select option{background:#1e1e2e;color:#fff;}
</style><script>
function swGoto(v,type){
  if(!v||v==="__cur__")return;
  window.location.href=v;
}
(function(){
  // 分析历史
  var asel=document.getElementById("sw-hist-select");
  if(asel){
    fetch("https://dora-ye666.github.io/clothes-creative-report-2026-by-dora-ye/analysis_reports.json?t="+Date.now())
      .then(r=>r.json()).then(function(rpts){
        asel.innerHTML="";
        var c=document.createElement("option");c.value="__cur__";c.text="当前最新";asel.appendChild(c);
        var sp=document.createElement("option");sp.disabled=true;sp.text="────";asel.appendChild(sp);
        rpts.slice().reverse().forEach(function(r){
          var o=document.createElement("option");
          o.value="https://dora-ye666.github.io/clothes-creative-report-2026-by-dora-ye/"+r.file;
          o.text=r.gen_date+" ("+r.date+")";asel.appendChild(o);
        });
      }).catch(function(){asel.innerHTML="<option>暂无历史</option>";});
  }
  // 品牌历史
  var bsel=document.getElementById("sw-brand-select");
  if(bsel){
    fetch("https://dora-ye666.github.io/brand-clothes-video-material-analysis-by-dora-ye/brand_reports.json?t="+Date.now())
      .then(r=>r.json()).then(function(rpts){
        bsel.innerHTML="";
        var c=document.createElement("option");c.value="__cur__";c.text="当前最新";bsel.appendChild(c);
        var sp=document.createElement("option");sp.disabled=true;sp.text="────";bsel.appendChild(sp);
        rpts.slice().reverse().forEach(function(r){
          var o=document.createElement("option");
          o.value="https://dora-ye666.github.io/brand-clothes-video-material-analysis-by-dora-ye/"+r.file;
          o.text=r.date+" ("+r.gen_date+")";bsel.appendChild(o);
        });
      }).catch(function(){bsel.innerHTML="<option>暂无历史</option>";});
  }
})();
</script>
</body>
</html>
