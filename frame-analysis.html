<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>页面维护中</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff8f8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.container{text-align:center;padding:40px 24px}
.icon{font-size:64px;margin-bottom:24px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
h1{font-size:28px;font-weight:700;color:#dc2626;margin-bottom:12px}
p{font-size:15px;color:#888;line-height:1.7;margin-bottom:8px}
.badge{display:inline-block;margin-top:24px;padding:8px 20px;background:#fff;border:1px solid #fee2e2;border-radius:99px;font-size:12px;color:#dc2626}
</style>
</head>
<body>
<div class="container">
  <div class="icon">🔧</div>
  <h1>页面维护中</h1>
  <p>该报告正在更新维护</p>
  <p>请稍后再访问，感谢您的耐心等待</p>
  <div class="badge">⏳ Under Maintenance</div>
</div>
</body>
</html>
